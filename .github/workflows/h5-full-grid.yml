name: H5 full grid reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-grid:
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            data/kipping_master_dl/wow-main/wow.f90
            data/kipping_master_dl/wow-main/LICENSE
            data/kipping_master_dl/wow-main/output_grid.dat
          sparse-checkout-cone-mode: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran

      - name: Compile unchanged source
        run: |
          set -euo pipefail
          mkdir -p audit
          gfortran --version | tee audit/compiler-version.txt
          sha256sum data/kipping_master_dl/wow-main/wow.f90 | tee audit/source-sha256.txt
          gfortran -O2 data/kipping_master_dl/wow-main/wow.f90 -o audit/wow_full.exe 2>&1 | tee audit/compile.log

      - name: Run full 150 by 160 estimator grid
        run: |
          set -euo pipefail
          cd audit
          rm -f output.log
          start=$(date +%s)
          ./wow_full.exe > run_stdout.txt 2>&1
          end=$(date +%s)
          echo "elapsed_seconds=$((end-start))" > elapsed.txt
          wc -l output.log
          head -3 output.log
          tail -3 output.log

      - uses: actions/upload-artifact@v4
        with:
          name: h5-full-grid-reproduction
          if-no-files-found: error
          path: |
            audit/output.log
            audit/elapsed.txt
            audit/compiler-version.txt
            audit/source-sha256.txt
            audit/compile.log
            data/kipping_master_dl/wow-main/output_grid.dat
