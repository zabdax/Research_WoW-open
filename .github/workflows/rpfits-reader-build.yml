name: RPFITS reader build audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reader:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-make make curl tar

      - name: Fetch official RPFITS 2.27 source
        run: |
          set -euo pipefail
          mkdir -p audit/rpfits
          curl -fsSL ftp://ftp.atnf.csiro.au/pub/software/rpfits/rpfits-2.27.tar.gz -o audit/rpfits-2.27.tar.gz
          sha256sum audit/rpfits-2.27.tar.gz | tee audit/rpfits-sha256.txt
          tar -xzf audit/rpfits-2.27.tar.gz -C audit/rpfits \
            --exclude='rpfits/code/darwin' --exclude='rpfits/linux_x86_64'

      - name: Build library and header tools
        run: |
          set -euo pipefail
          cd audit/rpfits/rpfits/linux64
          make FC=gfortran CC=gcc MACHTYPE=x all 2>&1 | tee ../../build.log
          mkdir -p ../../bundle
          cp -p librpfits.a rpfhdr.exe rpfex.exe ../../bundle/

      - name: Compile minimal spectrum dumper
        run: |
          set -euo pipefail
          cd audit
          cat > rpfdump.f <<'EOF'
                program rpfdump
                implicit none
                include 'rpfits.inc'
                integer, parameter :: mxch = 8192
                real vis(mxch), wt(mxch)
                real ut, uu, vv, ww, tbase
                integer istat, flag, bin, ifno, srcno, k, nspec, j
                character*256 a1, a2
                call get_command_argument(1, a1)
                call get_command_argument(2, a2)
                read(a2,*) nspec
                file = a1
                version = 'rpfdump 1.0'
                istat = -2
                call rpfitsin(istat, vis, wt, tbase, ut, uu, vv, ww,
               &     flag, bin, ifno, srcno)
                write(*,*) 'OBJECT ', object
                write(*,*) 'N_IF ', n_if
                do k=1,n_if
                  write(*,*) 'IF ',k,' NFREQ ',if_nfreq(k),' FREQ ',if_freq(k),
               &    ' BW ',if_bw(k)
                enddo
                write(*,*) 'N_SU ', n_su
                do k=1,n_su
                  write(*,*) 'SU ',k,' ',su_name(k),' RA ',su_ra(k),' DEC ',
               &    su_dec(k),' CAL ',su_cal(k)
                enddo
                write(*,*) 'N_FG ', n_fg
                do k=1,nspec
                  istat = 0
                  call rpfitsin(istat, vis, wt, tbase, ut, uu, vv, ww,
               &     flag, bin, ifno, srcno)
                  if (istat .ne. 0) exit
                  write(*,*) 'SPEC ',k,' UT ',ut,' IF ',ifno,' SRC ',srcno,
               &    ' FLAG ',flag
                  write(*,*) 'CHAN ', (vis(j),j=1,10)
                enddo
                end
          EOF
          cd rpfits/rpfits/linux64
          gfortran -O0 -g -fallow-argument-mismatch -fno-automatic -Wall \
            -I ../code ../../../rpfdump.f librpfits.a -lgfortran -lm -o ../../bundle/rpfdump.exe 2>&1 | tee ../../dump-compile.log

      - name: Bundle required runtime DLLs
        run: |
          set -euo pipefail
          cd audit/rpfits/bundle
          for exe in rpfhdr.exe rpfex.exe rpfdump.exe; do
            ldd "$exe" | grep -E '/ucrt64/bin/' | awk '{print $3}' | sort -u >> dll-list.txt || true
          done
          sort -u dll-list.txt -o dll-list.txt
          while read -r dll; do [ -n "$dll" ] && cp -n "$dll" .; done < dll-list.txt
          cp -p ../rpfits-sha256.txt .
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: rpfits-reader-bundle
          if-no-files-found: error
          path: |
            audit/rpfits/bundle/
            audit/build.log
            audit/dump-compile.log
